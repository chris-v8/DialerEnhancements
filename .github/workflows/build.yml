# SPDX-License-Identifier: GPL-3.0-or-later
name: Build

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      # Caches Gradle and checks the wrapper. No build scans are published.
      - uses: gradle/actions/setup-gradle@v4

      - name: Test, lint and build the debug APK
        run: ./gradlew testDebugUnitTest lintDebug assembleDebug

      - uses: actions/upload-artifact@v4
        with:
          name: DialerEnhancements-debug
          path: app/build/outputs/apk/debug/*.apk
          retention-days: 14

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: reports
          path: |
            app/build/reports/
            app/build/test-results/
          retention-days: 7
